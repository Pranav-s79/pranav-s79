name: Profile visuals

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pranav-s79
          filename: github-metrics.svg
          template: terminal
          base: header, repositories
          config_timezone: America/Chicago
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_sections: most-used
          repositories_forks: no
          repositories_skipped: |
            Pranav-s79/Pranav-s79
            Pranav-s79/TEST

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5C4EE6&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#8b5cf6,#5C4EE6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#5C4EE6&color_dots=#161b22,#312e81,#4338ca,#7c3aed,#5C4EE6

      - name: Publish SVGs to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch -C output origin/output
          else
            git switch --orphan output
          fi
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp dist/*.svg .
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Snake files are already current."
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git push origin output
